server {
    server_name 39.106.169.147 qddflc.com www.qddflc.com;
    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/dongfanglicai-access.log;
    error_log /var/log/nginx/dongfanglicai-error.log;

    # ---- 安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ========== 安全阻断（必须在 PHP 处理之前） ==========

    # 禁止直接访问敏感文件
    location = /xmlrpc.php { deny all; access_log off; log_not_found off; }
    location = /wp-config.php { deny all; }
    location = /readme.html { deny all; }
    location = /license.txt { deny all; }
    location = /wp-config-sample.php { deny all; }

    # 禁止访问 wp-includes 中的 PHP
    location ~ ^/wp-includes/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 允许 downloads 目录下载
    location ^~ /downloads/ {
        alias /var/www/html/downloads/;
        add_header Content-Disposition "attachment";
    }

    # 禁止访问敏感文件类型
    location ~* \.(sql|tgz|zip|tar|gz|log|bak|swp|old|ini|sh)$ {
        deny all;
    }

    # ========== 正常路由 ==========

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # wp-login.php 限流
    location = /wp-login.php {
        limit_req zone=wp_login burst=2 nodelay;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt {
        try_files $uri /index.php?robots=1;
        log_not_found off;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qddflc.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qddflc.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.qddflc.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = qddflc.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 39.106.169.147 qddflc.com www.qddflc.com;
    return 301 https://qddflc.com$request_uri;




}
