server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  # Temporary protection while the API still accepts shared development identities.
  location ^~ /api/auth/wx-login {
    return 403;
  }

  location ^~ /api/auth/bind-mobile {
    return 403;
  }

  location ^~ /api/member/ {
    return 403;
  }

  location /api/ {
    proxy_pass http://qddflc-api.dns.podman:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://qddflc-api.dns.podman:3000/uploads/;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
